[package]
name = "aerosieve-segment"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hysteresis VAD segmentation producing variable-length speech clips"
repository = "https://github.com/kunalgoesbyken/AeroSieve"
readme = "README.md"
keywords = ["audio", "speech", "vad", "dataset", "webdataset"]
categories = ["multimedia::audio"]

[features]
default = []
silero = ["dep:ort"]

[dependencies]
aerosieve-acoustic.workspace = true
thiserror.workspace = true
ort = { workspace = true, optional = true }

[dev-dependencies]
aerosieve-fixtures.workspace = true
proptest.workspace = true
