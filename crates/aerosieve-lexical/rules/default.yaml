# Default normalization rules for code-mixed Hinglish transcripts.
#
# These are applied by a SINGLE-PASS, leftmost-longest, non-overlapping matcher.
# Every rule matches the ORIGINAL text only; no rule ever sees another rule's
# output. Conflicts resolve by (start asc, length desc, priority desc, order).
#
# `priority` only matters for matches that start at the SAME offset with the
# SAME length. Longer matches already win on their own — do not add priority
# to express "this is more specific", express it in the pattern.
#
# NOTE: whitespace collapsing is NOT a rule. It is an explicit final step in
# the engine (`normalize_whitespace`). A `\s+` rule would match nearly every
# span in the input and starve real rules during conflict resolution.
version: 2
rules:
  # --- Currency: INR ----------------------------------------------------
  # `₹500` and `Rs. 500` both land on "<n> rupaye". The word forms below only
  # match spelled-out currency in the ORIGINAL text, so they can never fire on
  # the "rupaye" this rule inserts.
  - pattern: '₹\s*(\d+(?:,\d{2,3})*(?:\.\d+)?)'
    replacement: '$1 rupaye'
    action: Replace
    category: currency
    priority: 20
  - pattern: '\bRs\.?\s*(\d+(?:,\d{2,3})*(?:\.\d+)?)'
    replacement: '$1 rupaye'
    action: Replace
    category: currency
    priority: 20
  - pattern: '\b(\d+)\s*rupees?\b'
    replacement: '$1 rupaye'
    action: Replace
    category: currency
  - pattern: '\b(\d+)\s*paise\b'
    replacement: '$1 paise'
    action: Replace
    category: currency

  # --- Indian numbering scale -------------------------------------------
  # Priority above the bare currency rules so that "5 lakh rupaye" resolves
  # the scale word; the spans are disjoint anyway, this is belt-and-braces.
  - pattern: '\b(\d+)\s*(?:hazaar|hazar|hazzar)\b'
    replacement: '$1 hazaar'
    action: Replace
    category: scale
    priority: 10
  - pattern: '\b(\d+)\s*(?:lakh|laakh|lac|lakhs)\b'
    replacement: '$1 lakh'
    action: Replace
    category: scale
    priority: 10
  - pattern: '\b(\d+)\s*(?:crore|karod|caror|crores)\b'
    replacement: '$1 crore'
    action: Replace
    category: scale
    priority: 10

  # --- Dates -------------------------------------------------------------
  - pattern: '\b(\d{1,2})[/-](\d{1,2})[/-](\d{2,4})\b'
    replacement: '$1-$2-$3'
    action: Replace
    category: dates
  - pattern: '\b(\d{1,2})(?:st|nd|rd|th)\s+(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|january|february|march|april|june|july|august|september|october|november|december)\b'
    replacement: '$1 $2'
    action: Replace
    category: dates

  # --- Abbreviations -----------------------------------------------------
  # `i.e.` / `e.g.` outrank shorter overlapping matches by being longer.
  # Trailing `\s` is dropped from the v1 patterns so the whitespace step
  # (not the rule) owns spacing, and so the rule cannot swallow a separator
  # that an adjacent rule's span needs.
  - pattern: '\bi\.e\.?'
    replacement: 'that is'
    action: Replace
    category: abbreviations
    priority: 10
  - pattern: '\be\.g\.?'
    replacement: 'for example'
    action: Replace
    category: abbreviations
    priority: 10
  - pattern: '\bdr\.?\b'
    replacement: 'doctor'
    action: Replace
    category: abbreviations
  - pattern: '\bprof\.?\b'
    replacement: 'professor'
    action: Replace
    category: abbreviations
  - pattern: '\bgovt\.?\b'
    replacement: 'government'
    action: Replace
    category: abbreviations
  - pattern: '\bdept\.?\b'
    replacement: 'department'
    action: Replace
    category: abbreviations
  - pattern: '\buniv\.?\b'
    replacement: 'university'
    action: Replace
    category: abbreviations
  - pattern: '\bvs\.?\b'
    replacement: 'versus'
    action: Replace
    category: abbreviations
  - pattern: '\betc\.?'
    replacement: 'etcetera'
    action: Replace
    category: abbreviations

  # --- Hinglish code-mixing phrases --------------------------------------
  # Multi-word phrases. Longest-match means these beat the single-word
  # spelling rules below wherever they overlap (e.g. "hai" inside
  # "mujhe jana hai"), so the phrase is never half-rewritten.
  - pattern: '\bmain\s+(\w+)\s+raha\s+hu[mn]?\b'
    replacement: 'I am $1ing'
    action: Replace
    category: code_mixing
  - pattern: '\bmain\s+(\w+)\s+rahi\s+hu[mn]?\b'
    replacement: 'I am $1ing'
    action: Replace
    category: code_mixing
  - pattern: '\bhum\s+(\w+)\s+rahe\s+hai[nm]?\b'
    replacement: 'we are $1ing'
    action: Replace
    category: code_mixing
  - pattern: '\bmujhe\s+(\w+)\s+chahiye\b'
    replacement: 'I want $1'
    action: Replace
    category: code_mixing
  - pattern: '\bmujhe\s+(\w+)\s+hai\b'
    replacement: 'I need to $1'
    action: Replace
    category: code_mixing

  # --- Hinglish spelling normalization -----------------------------------
  # The v1 rule `\b(?:hein|hai|h)\b -> hai` is fixed here: the bare `h`
  # alternative made every standalone letter `h` (initials, "h" as a filler,
  # spelled-out letters) rewrite to "hai". Only real spelling variants remain.
  - pattern: '\b(?:hein|hai|hay|hy)\b'
    replacement: 'hai'
    action: Replace
    category: spelling
  - pattern: '\b(?:hu|hoon|hun|hoo)\b'
    replacement: 'hoon'
    action: Replace
    category: spelling
  - pattern: '\b(?:kya|kaya|kyaa)\b'
    replacement: 'kya'
    action: Replace
    category: spelling
  - pattern: '\b(?:acha|accha|achchha|achha)\b'
    replacement: 'achha'
    action: Replace
    category: spelling
  - pattern: '\b(?:koi|koyi|kohi)\b'
    replacement: 'koi'
    action: Replace
    category: spelling
  - pattern: '\b(?:bahut|bahaut|bohot|bohut)\b'
    replacement: 'bahut'
    action: Replace
    category: spelling
  - pattern: '\b(?:thoda|thora|thodaa)\b'
    replacement: 'thoda'
    action: Replace
    category: spelling
  - pattern: '\b(?:nahi|nahin|nahee|nhi)\b'
    replacement: 'nahi'
    action: Replace
    category: spelling
  - pattern: '\b(?:abhi|abhee)\b'
    replacement: 'abhi'
    action: Replace
    category: spelling

  # --- Cleanup: markup and entities --------------------------------------
  - pattern: '<[^>]+>'
    replacement: ''
    action: Remove
    category: cleanup
  - pattern: '&[a-zA-Z]+;'
    replacement: ''
    action: Remove
    category: cleanup

  # --- Cleanup: disfluencies ---------------------------------------------
  # `like` removed from the v1 list: it is a real English word far more often
  # than a filler, and a single-pass matcher gives it no chance to recover.
  - pattern: '\b(?:umm|uhh|aah|err|hmm|uhm|mmm)\b'
    replacement: ''
    action: Remove
    category: disfluency

  # --- Punctuation spacing ------------------------------------------------
  # Strip whitespace BEFORE punctuation only. Spacing after punctuation is
  # left to the whitespace step, which runs last and cannot be starved.
  # v1's `\s*([.,!?;:])\s*` competed with every other rule for spans.
  - pattern: '\s+([.,!?;:])'
    replacement: '$1'
    action: Replace
    category: punctuation
