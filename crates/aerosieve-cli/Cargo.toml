[package]
name = "aerosieve-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for the AeroSieve audio curation pipeline"
repository = "https://github.com/kunalgoesbyken/AeroSieve"
readme = "README.md"
keywords = ["audio", "speech", "vad", "dataset", "webdataset"]
categories = ["multimedia::audio", "command-line-utilities"]

[[bin]]
name = "aerosieve"
path = "src/main.rs"
doc = false

[dependencies]
aerosieve.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
aerosieve-fixtures.workspace = true
hound.workspace = true
tempfile.workspace = true
