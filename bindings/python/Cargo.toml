[package]
name = "aerosieve-py"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Python bindings for the AeroSieve audio curation pipeline"
publish = false

[lib]
name = "aerosieve"
crate-type = ["cdylib"]

[dependencies]
aerosieve = { path = "../../crates/aerosieve" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pythonize = "0.29"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
