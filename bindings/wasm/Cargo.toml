[package]
name = "aerosieve-wasm"
version = "0.4.0"
edition = "2024"
license = "MIT"
description = "WebAssembly bindings for the AeroSieve audio curation pipeline"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aerosieve = { path = "../../crates/aerosieve", default-features = false }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
