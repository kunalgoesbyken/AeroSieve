[workspace]
resolver = "3"
members = [
    "crates/aerosieve-fixtures",
    "crates/aerosieve-acoustic",
    "crates/aerosieve-decode",
    "crates/aerosieve-segment",
    "crates/aerosieve-shard",
    "crates/aerosieve-lexical",
    "crates/aerosieve",
    "crates/aerosieve-cli",
]
exclude = ["bindings/python"]

[workspace.package]
edition = "2024"
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
aerosieve-fixtures = { path = "crates/aerosieve-fixtures" }
aerosieve-acoustic = { path = "crates/aerosieve-acoustic", version = "0.3.0" }
aerosieve-decode = { path = "crates/aerosieve-decode", version = "0.3.0" }
aerosieve-segment = { path = "crates/aerosieve-segment", version = "0.3.0" }
aerosieve-shard = { path = "crates/aerosieve-shard", version = "0.3.0" }
aerosieve-lexical = { path = "crates/aerosieve-lexical", version = "0.3.0" }
aerosieve = { path = "crates/aerosieve", version = "0.3.0" }

thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
symphonia = { version = "0.5", features = ["all"] }
rubato = "0.16"
tar = "0.4"
regex = "1.11"
hound = "3.5"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
criterion = "0.5"
proptest = "1"
tempfile = "3"
ort = "2.0.0-rc.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
